# 关节速度/加速度上限。URDF 里的 <limit> 只写了位置范围，MoveIt 的时间最优
# 参数化（AddTimeOptimalParameterization）要求加速度上限，缺了会直接报
# "No acceleration limit was defined for joint joint_N"，规划结果没有时间戳、
# 也就不会真的执行。所以这里补齐。
#
# 数值取 Damiao 电机减速后的关节侧保守值：上层关节负载小、可以快一些，
# 腕部三轴惯量小、给同样的量级。
default_velocity_scaling_factor: 0.3
default_acceleration_scaling_factor: 0.3

joint_limits:
  joint_1:
    has_velocity_limits: true
    max_velocity: 2.0
    has_acceleration_limits: true
    max_acceleration: 4.0
  joint_2:
    has_velocity_limits: true
    max_velocity: 2.0
    has_acceleration_limits: true
    max_acceleration: 4.0
  joint_3:
    has_velocity_limits: true
    max_velocity: 2.0
    has_acceleration_limits: true
    max_acceleration: 4.0
  joint_4:
    has_velocity_limits: true
    max_velocity: 2.0
    has_acceleration_limits: true
    max_acceleration: 4.0
  joint_5:
    has_velocity_limits: true
    max_velocity: 2.0
    has_acceleration_limits: true
    max_acceleration: 4.0
  joint_6:
    has_velocity_limits: true
    max_velocity: 2.0
    has_acceleration_limits: true
    max_acceleration: 4.0
